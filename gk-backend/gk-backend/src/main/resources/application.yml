spring:
  # 数据库连接配置
  datasource:
    # createDatabaseIfNotExist=true 会在数据库不存在时自动创建
    url: jdbc:mysql://localhost:3306/gk_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Flyway 自动建表配置
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# 设置后端运行的端口
server:
  port: 8080

# 大模型 API 配置（兼容 OpenAI 格式，支持 DeepSeek / MiMo / 硅基流动等）
ai:
  api-key: sk-cga07vbgj9j3zibs2qfea4uxr705coqbznddjk02cwxzlir1
  base-url: https://api.xiaomimimo.com/v1
  model: mimo-v2.5-pro

langchain4j:
  open-ai:
    chat-model:
      base-url: ${ai.base-url}
      api-key: ${ai.api-key}
      model-name: ${ai.model}
      temperature: 0.7
      log-requests: true
      log-responses: true
      timeout: PT120S